# Enable gzip compression for JS, CSS, JSON, SVG, and web fonts
# (Fixes 12MB uncompressed Grafana JS bundle timeouts over mobile/Tailscale DERP)
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_buffers 32 16k;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/manifest+json
    application/xml
    application/rss+xml
    image/svg+xml
    font/ttf
    font/woff
    font/woff2;

# Increase proxy buffers to avoid spilling large JS bundles to /var/cache/nginx/proxy_temp
proxy_buffer_size 128k;
proxy_buffers 64 128k;
proxy_busy_buffers_size 256k;
send_timeout 180s;

# Bust poisoned mobile browser caches where truncated uncompressed Grafana bundles were cached
sub_filter_once off;
sub_filter '.3972e89a1490d496d5b7.js"' '.3972e89a1490d496d5b7.js?v=2"';
sub_filter '.0549a3fcb50e73c4b256.js"' '.0549a3fcb50e73c4b256.js?v=2"';
sub_filter '.c53eb219979d7cb3b2d4.js"' '.c53eb219979d7cb3b2d4.js?v=2"';
