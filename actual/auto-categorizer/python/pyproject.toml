[tool.poetry]
name = "auto-categorizer-ml"
version = "0.1.0"
description = "Machine Learning model training and ONNX export pipeline for Actual Budget auto-categorizer"
authors = ["Jacob Miller"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
scikit-learn = "^1.3.0"
skl2onnx = "^1.15.0"
onnxruntime = "^1.16.0"
numpy = "^1.24.0"
pandas = "^2.0.0"
python-dotenv = "^1.0.0"
requests = "^2.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
