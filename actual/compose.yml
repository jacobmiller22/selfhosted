services:
  actual_server:
    image: docker.io/actualbudget/actual-server:26.9.0
    # See all options and more details at https://actualbudget.github.io/docs/Installing/Configuration
    volumes:
      # Change './actual-data' below to the path to the folder you want Actual to store its data in on your server.
      # '/data' is the path Actual will look for its files in by default, so leave that as-is.
      - actual-data:/data/
    restart: unless-stopped
    networks:
      - nginx-proxy-manager

  actual-backup:
    build:
      context: ./backup
    container_name: actual-backup
    restart: unless-stopped
    environment:
      - SERVICE_NAME=actual
      - BACKUP_SOURCE_DIR=/tmp/actual-data
      - BACKUP_DEST_PREFIX=backups/actual
      - BACKUP_DEST_ENDPOINT=${BACKUP_DEST_ENDPOINT}
      - BACKUP_DEST_BUCKET=${BACKUP_DEST_BUCKET}
      - BACKUP_DEST_ACCESS_KEY_ID=${BACKUP_DEST_ACCESS_KEY_ID}
      - BACKUP_DEST_SECRET_ACCESS_KEY=${BACKUP_DEST_SECRET_ACCESS_KEY}
      - BACKUP_PASSPHRASE=${BACKUP_PASSPHRASE:-}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - HEALTHCHECK_PING_URL=${HEALTHCHECK_PING_URL:-}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 16 * * *}
    volumes:
      - actual-data:/tmp/actual-data:ro

  actual-auto-categorizer:
    build:
      context: ./tools/auto-categorizer
      dockerfile: Dockerfile
    container_name: actual-auto-categorizer
    environment:
      - ACTUAL_SERVER_URL=${ACTUAL_SERVER_URL:-https://budget.cloud.jacobmiller22.com}
      - ACTUAL_PASSWORD=${ACTUAL_PASSWORD}
      - ACTUAL_SYNC_ID=${ACTUAL_SYNC_ID:-d87856b0-5fd1-4b3e-85bc-bf1e9244d4be}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.85}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-*/15 * * * *}
      - PORT=${AUTO_CATEGORIZER_PORT:-3080}
      - DRY_RUN=false
    volumes:
      - ./auto-categorizer-models:/app/src/models
    ports:
      - "3080:3080"
    restart: "no"
    networks:
      - nginx-proxy-manager

networks:
  nginx-proxy-manager:
    external: true

volumes:
  actual-data:
