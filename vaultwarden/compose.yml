services:
  vaultwarden:
    image: vaultwarden/server:1.35.4
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "https://vw.cloud.jacobmiller22.com"
      SIGNUPS_ALLOWED: "true"
    volumes:
      - vw-data:/data/
    ports:
      - 7277:80
    networks:
      - nginx-proxy-manager

  vaultwarden-staging:
    image: vaultwarden/server:1.35.4
    container_name: vaultwarden-staging
    profiles: ["staging"]
    restart: unless-stopped
    environment:
      DOMAIN: "http://localhost:7278"
      SIGNUPS_ALLOWED: "false"
    volumes:
      - vw-stage-data:/data
    ports:
      - "7278:80"
    networks:
      - staging-net
    mem_limit: 256m
    cpus: 0.50

  vw-backup:
    build:
      context: ./backup
    container_name: vw-backup
    restart: unless-stopped
    environment:
      - SERVICE_NAME=vaultwarden
      - BACKUP_SOURCE_DIR=/tmp/vw-data
      - BACKUP_DEST_PREFIX=backups/vaultwarden
      - BACKUP_DEST_ENDPOINT=${BACKUP_DEST_ENDPOINT}
      - BACKUP_DEST_BUCKET=${BACKUP_DEST_BUCKET}
      - BACKUP_DEST_ACCESS_KEY_ID=${BACKUP_DEST_ACCESS_KEY_ID}
      - BACKUP_DEST_SECRET_ACCESS_KEY=${BACKUP_DEST_SECRET_ACCESS_KEY}
      - BACKUP_PASSPHRASE=${BACKUP_PASSPHRASE:-}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - HEALTHCHECK_PING_URL=${HEALTHCHECK_PING_URL:-}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 16 * * *}
    volumes:
      - vw-data:/tmp/vw-data:ro
networks:
  nginx-proxy-manager:
    name: nginx-proxy-manager
    external: true
  staging-net:

volumes:
  vw-data:
  vw-stage-data:
