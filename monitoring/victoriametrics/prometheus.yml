global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # 1. Host Infrastructure Telemetry
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'bjorn'
          environment: 'production'

  # 2. Container & Cgroups Telemetry
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: 'bjorn'
          environment: 'production'
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
        action: replace
      - source_labels: [name]
        regex: '^/?(.*)$'
        target_label: container
        replacement: '$1'
        action: replace

  # 3. Time-Series Database Self-Monitoring
  - job_name: 'victoria-metrics'
    static_configs:
      - targets: ['victoria-metrics:8428']
        labels:
          instance: 'bjorn'
          environment: 'production'

  # 4. Outside-In Blackbox Probing
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://budget.cloud.jacobmiller22.com
        - https://vw.cloud.jacobmiller22.com
        - https://ha.cloud.jacobmiller22.com
        - https://coolify.cloud.jacobmiller22.com
        - https://monitoring.cloud.jacobmiller22.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
