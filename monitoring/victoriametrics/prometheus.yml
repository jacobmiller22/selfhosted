global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # 1. Host Infrastructure Telemetry
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'bjorn'
          environment: 'production'

  # 2. Container & Cgroups Telemetry
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: 'bjorn'
          environment: 'production'
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
        action: replace
      - source_labels: [name]
        regex: '^/?(.*)$'
        target_label: container
        replacement: '$1'
        action: replace

  # 3. Time-Series Database Self-Monitoring
  - job_name: 'victoria-metrics'
    static_configs:
      - targets: ['victoria-metrics:8428']
        labels:
          instance: 'bjorn'
          environment: 'production'
