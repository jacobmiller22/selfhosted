services:
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.99.0
    container_name: victoria-metrics
    restart: unless-stopped
    command:
      - -promscrape.config=/etc/prometheus/prometheus.yml
      - -promscrape.config.strictParse=false
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=90d
      - -search.maxQueryDuration=30s
      - -maxLabelsPerTimeseries=64
    volumes:
      - victoria-data:/victoria-metrics-data
      - ./victoriametrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "8428:8428"
    networks:
      - monitoring
    extra_hosts:
      - "node-exporter:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 64M
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: false
    command:
      - --housekeeping_interval=15s
      - --disable_metrics=percpu,sched,process,hugetlb,referenced_memory
      - --docker_only=true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 80M
        reservations:
          memory: 40M
    mem_limit: 80m
    cpus: 0.20

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.1
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/.+)($$|/)
      - --web.listen-address=:9100
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 30M
        reservations:
          memory: 15M
    mem_limit: 30m
    cpus: 0.10

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
        reservations:
          memory: 32M
    mem_limit: 64m
    cpus: 0.10

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-https://monitoring.cloud.jacobmiller22.com}
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-https://example.com/webhook/placeholder}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - actual-analytics-data:/var/lib/grafana/data/actual:ro
    networks:
      - monitoring
      - nginx-proxy-manager
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 120M
        reservations:
          memory: 60M
    mem_limit: 120m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  monitoring:
    name: monitoring
    driver: bridge
  nginx-proxy-manager:
    name: nginx-proxy-manager
    external: true

volumes:
  victoria-data:
    name: victoria-data
  grafana-data:
    name: grafana-data
  actual-analytics-data:
    name: actual-analytics-data
    external: true
